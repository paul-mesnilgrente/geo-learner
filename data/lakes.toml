# Lacs du monde (`mapgen lakes`) : 58 grands lacs naturels et réservoirs, d'après Natural Earth
# 1:50m (`ne_50m_lakes`). `lake` donne les entités Natural Earth (par leur nom) qui forment le
# lac : la mer d'Aral en a deux (Grande et Petite), le lac Eyre aussi (Nord et Sud).
#
# Les lacs sont peints par-dessus les terres, en couleur d'eau. La Caspienne, la plus grande
# étendue d'eau fermée, est déjà dans le quiz des mers ; les lacs absents du 1:50m (Garde,
# Majeur, Ohrid, Neuchâtel) n'y figurent pas.
#
# `aka` accepte le nom sans « lac » (« Victoria », « Baïkal ») ; `say` : formes orales pour les
# noms absents du vocabulaire du modèle vocal.

