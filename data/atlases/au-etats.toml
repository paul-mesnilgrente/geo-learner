# États et territoires d'Australie (Natural Earth admin-1) : les six États et les deux
# territoires continentaux. L'île Lord Howe fait partie de la Nouvelle-Galles du Sud ; le
# territoire de la baie de Jervis (une enclave de 70 km²) et l'île Macquarie sont omis.

# Lieux à trouver (avant toute section : en TOML, une clé suit sinon la dernière section).
items = [
  { code = "AU-NSW", name = "Nouvelle-Galles du Sud", sub = "etats" },
  { code = "AU-VIC", name = "Victoria", sub = "etats" },
  { code = "AU-QLD", name = "Queensland", sub = "etats" },
  { code = "AU-SA", name = "Australie-Méridionale", sub = "etats" },
  { code = "AU-WA", name = "Australie-Occidentale", sub = "etats" },
  { code = "AU-TAS", name = "Tasmanie", sub = "etats" },
  { code = "AU-NT", name = "Territoire du Nord", sub = "territoires" },
  { code = "AU-ACT", name = "Territoire de la capitale australienne", sub = "territoires" },
]

[atlas]
