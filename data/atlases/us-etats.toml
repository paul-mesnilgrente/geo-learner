[atlas]
id = "us-etats"
title = "États des États-Unis"
category = "États-Unis"
levels = ["Régions", "Divisions"]
one = "État"
many = "États"
country = "USA"
context = [-140.0, 12.0, -50.0, 60.0]

# Alaska et Hawaï en encarts, dans le Pacifique au large de la Californie.
[[inset]]
codes = ["US-AK"]
to = [-129.0, 29.5]
scale = 0.3

[[inset]]
codes = ["US-HI"]
to = [-122.0, 24.0]
