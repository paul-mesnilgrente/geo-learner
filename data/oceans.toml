# Océans du monde (`mapgen water`). Chaque océan est un grand polygone (lon, lat) dessiné
# SOUS les terres : seuls ses bords en mer comptent, le reste passe sous les continents, qui
# le recouvrent le long des côtes. Pas de jour possible entre océans : leurs bords communs
# reprennent les mêmes sommets.
#
# Limites, simplifiées, d'après l'OHI (« Limits of Oceans and Seas ») et le World Factbook :
# - Austral : au sud de 60° S ;
# - Atlantique / Pacifique : méridien du cap Horn (67° 16' O), puis l'isthme américain ;
# - Atlantique / Indien : méridien du cap des Aiguilles (20° E), puis Suez ;
# - Indien / Pacifique : Tasmanie (146° 55' E), détroit de Bass, Timor, petites îles de la
#   Sonde, détroit de la Sonde, Sumatra, Singapour, isthme de Kra ;
# - Arctique : détroit de Béring, mer de Barents (cap Nord, île aux Ours, Svalbard), Jan Mayen,
#   Islande, détroit de Danemark, détroit de Davis ; la baie d'Hudson et la mer du Groenland
#   en font partie, la mer de Norvège non.
# La Méditerranée, la mer Noire et la Baltique sont dans l'Atlantique ; la mer Rouge et le
# golfe Persique dans l'océan Indien. La Caspienne, un lac, est un trou de l'océan Indien
# (contour tracé dans les terres qui l'entourent).
#
# Les terres du monde sont reprises de l'atlas du monde à l'exécution ; seul l'Antarctique,
# absent de cet atlas, est embarqué ici (`land`).

