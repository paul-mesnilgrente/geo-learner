# un point, placé d'après Natural Earth 1:50m (`ne_50m_populated_places`) : la ville marquée
# « Admin-0 capital » du pays, ou `city` (nom Natural Earth) quand il y en a plusieurs ou
# qu'elle est rangée ailleurs, ou `label` [lon, lat] quand elle manque.
#
# Pays à plusieurs capitales : la capitale officielle est le point et le nom ; les autres sont
# acceptées en réponse si elles partagent le titre (Afrique du Sud : Pretoria, Le Cap,
# Bloemfontein ; Bolivie : Sucre, La Paz ; Sri Lanka : Kotte, Colombo). Une simple capitale
# économique ne l'est pas (Abidjan, Cotonou, Dar es Salam, Lagos).
