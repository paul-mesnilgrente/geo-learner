  { code = "volga", name = "Volga", en = "Volga", sub = "europe", river = ["Volga"] },
  { code = "danube", name = "Danube", en = "Danube", sub = "europe", aka = ["Donau", "Duna", "Dunarea"], river = ["Danube", "Donau"] },
