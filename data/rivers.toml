# Fleuves du monde (`mapgen rivers`) : 55 grands fleuves (cours d'eau qui se jettent dans la mer
# ou dans une mer fermée), tracés d'après Natural Earth 1:10m (`ne_10m_rivers_lake_centerlines`).
#
# Natural Earth découpe un fleuve selon ses noms locaux : `river` réunit ses tronçons (Yangtsé =
# Tongtian + Jinsha + Chang Jiang + Yangtze). Les tronçons « Lake Centerline » du même nom (lacs
# de barrage : Nasser, Kariba, réservoirs de la Volga) sont repris aussi. `within` écarte les
# homonymes (Colorado d'Argentine, Mackenzie d'Australie) : seuls les tronçons entièrement dans ce
# cadre comptent. Le Saint-Laurent, presque absent des données, est tracé à la main (`rings`).
#
# Les affluents (Missouri, Madeira, Irtych…) ne sont pas des fleuves et n'y figurent pas.
#
# `say` : formes orales approchées, faites de mots que le modèle vocal français connaît, pour les
# noms absents de son vocabulaire (« brahma poutre », « tôt cantine »).

items = [
