# Mers du monde (`mapgen water`) : les mers (« sea ») de Natural Earth 1:50m, dessinées sous
# les terres comme les océans. Les deux parties des « mers intérieures de la côte occidentale de
# l'Écosse » de Natural Earth sont réunies en une seule mer des Hébrides : 52 mers en tout.
# Les autres eaux (golfes, baies, détroits, haute mer) restent neutres.
#
# Zones : l'océan dont chaque mer fait partie (comme dans le quiz des océans, où la mer de Scotia,
# au nord de 60° S, est dans l'Atlantique), avec des sous-zones pour l'Atlantique et le
# Pacifique. La Caspienne, un lac, n'est dans aucun océan : seulement dans « Toutes les mers ».
# Les points d'étiquette sont calculés (le point de chaque mer le plus éloigné de ses bords).
# `say` : prononciations faites de mots que le modèle vocal français connaît, pour les noms qu'il
# ignore (Barents, Laptev…).

