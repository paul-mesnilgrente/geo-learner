name: Paquets Linux

# Construit les paquets Linux et les joint à la release GitHub du tag (créée avec les notes de
# docs/releases/<tag>.md si le fichier existe) :
# - l'archive .tar.gz, compilée sur la plus ancienne Ubuntu disponible : le binaire exige la
#   glibc du système de compilation (2.35 ici), il tourne donc sur les distributions de 2022
#   et après ;
# - le paquet .flatpak (fichier unique), qui va chercher son runtime sur Flathub ;
# - le snap (snap/snapcraft.yaml), publié aussi sur le Snap Store si le secret
#   SNAPCRAFT_STORE_CREDENTIALS existe.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant auquel joindre les paquets, par exemple v0.2.0 (vide : simple artefact). Le code compilé est celui de la branche choisie, pas celui du tag."
        required: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Compilation release
        run: cargo build --release -p geo-learner

      - name: Archive
        run: ./scripts/package-linux.sh

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: geo-learner-linux
          path: target/linux/*.tar.gz
          if-no-files-found: error

      - name: Release GitHub
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "GeoLearner ${TAG#v}" --notes-file "$(f="docs/releases/$TAG.md"; [ -f "$f" ] && echo "$f" || echo /dev/null)"
          gh release upload "$TAG" target/linux/*.tar.gz --clobber

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Flatpak et dépôt Flathub
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Compilation
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub \
            --default-branch=stable --repo=target/flatpak-repo \
            target/flatpak packaging/flatpak/com.paul_mesnilgrente.GeoLearner.yml

      - name: Paquet .flatpak
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            target/flatpak-repo "target/geo-learner-$VERSION-x86_64.flatpak" com.paul_mesnilgrente.GeoLearner stable

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: geo-learner-flatpak
          path: target/*.flatpak
          if-no-files-found: error

      - name: Release GitHub
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "GeoLearner ${TAG#v}" --notes-file "$(f="docs/releases/$TAG.md"; [ -f "$f" ] && echo "$f" || echo /dev/null)"
          gh release upload "$TAG" target/*.flatpak --clobber

  snap:
    runs-on: ubuntu-24.04
    env:
      # Jeton du Snap Store (snapcraft export-login) ; sans lui, la publication est sautée.
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v5

      - name: Compilation du snap
        id: build
        uses: snapcore/action-build@v1

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: geo-learner-snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      - name: Release GitHub
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "GeoLearner ${TAG#v}" --notes-file "$(f="docs/releases/$TAG.md"; [ -f "$f" ] && echo "$f" || echo /dev/null)"
          gh release upload "$TAG" "$SNAP_FILE" --clobber

      - name: Publication sur le Snap Store (canal stable)
        if: env.SNAPCRAFT_STORE_CREDENTIALS != '' && (github.ref_type == 'tag' || inputs.tag != '')
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
